# Ametrine 前端生产部署配置（nginx）
#
# 用法：把 apps/frontend/dist 的内容放到 /srv/ametrine/frontend，
# 本文件 include 进 http {} 或放到 /etc/nginx/conf.d/，然后 nginx -t && systemctl reload nginx。
#
# ── 为什么需要这个文件：部署后「首次进入全白屏、手动刷新才好」的根因 ──
# Vite 每次构建都会给 /assets/*.js 换内容哈希名。index.html 里写死引用了这批名字。
# 如果 index.html 被缓存（nginx 默认对 HTML 也会给出 ETag/Last-Modified，
# 浏览器据此做启发式缓存），用户手上的旧 index.html 就会去请求上一版构建的
# /assets/index-<旧哈希>.js —— 服务器上已经没有这个文件了 → 404 → 入口脚本没跑 →
# #root 永远是空的 → 整页白屏。手动刷新一把拿到新的 index.html，于是"又好了"。
# 入口脚本 404 时 JS 无法自救（自救代码就在那个没下下来的文件里），
# 所以这一条必须由服务端的缓存策略来断掉：index.html 永不缓存，带哈希的资源永久缓存。
# 代码侧的兜底（8 秒启动看门狗 + vite:preloadError 自动重载）见
# apps/frontend/index.html 与 apps/frontend/src/utils/chunkRecovery.ts。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /srv/ametrine/frontend;
    index index.html;

    access_log /var/log/nginx/ametrine.access.log;
    error_log  /var/log/nginx/ametrine.error.log;

    # 压缩：335 KB 的入口分片不压缩的话首屏要多等好几秒，
    # 而首屏这段时间里屏幕是空的（现在至少有底色，见 index.html 的内联样式）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/ttf
        font/woff2;

    # 带内容哈希的构建产物：可以放心永久缓存
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # API 与后端同源时走这里的反代；前端 .env 用的是相对路径 /api，
    # 所以生产环境必须由 nginx 把 /api 转给 uvicorn（默认 3000 端口）。
    # SSE / 流式回答必须关缓冲，否则整段回答会等到结束才一次性吐出来。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        client_max_body_size 64m;   # 知识库上传的文档可能比较大
    }

    # favicon 之类带扩展名的静态文件
    location ~* \.(?:png|jpg|jpeg|svg|ico|webp|woff2?|ttf|map)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # SPA 回退：/chat/xxx、/admin/vector/2/7 这些深链接刷新时必须落回 index.html。
    # 没有这一段的话刷新就是 404（nginx 找不到同名文件），
    # 看起来同样是"白屏/打不开"，而且刷新也救不回来。
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        # 不要给 HTML 上 expires / if_modified_since 之外的强缓存；
        # no-cache 允许浏览器缓存但每次都必须回源校验，代价只是一个 304。
        try_files $uri $uri/ /index.html;
    }

    # index.html 绝不缓存 —— 这是白屏问题的核心那一行
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires off;
    }
}
