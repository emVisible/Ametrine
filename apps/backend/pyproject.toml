[project]
name = "backend"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.30.0",
    "bcrypt==4",
    "bitsandbytes>=0.46.0",
    "colorlog>=6.9.0",
    "compressed-tensors>=0.9.1",
    "dotenv>=0.9.9",
    # 下面四个原先都是靠 xinference[all] 传递进来的（`uv sync` 一执行就被剪掉，
    # 后端直接起不来：fastapi/starlette/jose 全部 ModuleNotFoundError，
    # 连 .venv/bin/uvicorn 这个入口脚本都没了）。应用自己的运行时必须自己声明。
    "fastapi>=0.136.3",
    # pydantic.EmailStr（src/user/dto.py 两处）在运行时才要它，原先也是 xinference[all] 带进来的
    "email-validator>=2.3.0",
    "starlette>=1.2.1",
    "uvicorn[standard]>=0.48.0",
    "python-jose[cryptography]>=3.5.0",
    "httpx>=0.27.2",
    "hyperpyyaml>=1.2.3",
    "langchain>=0.3.25",
    "langchain-community>=0.3.24",
    "langchain-experimental>=0.3.4",
    "langchain-milvus>=0.2.0",
    # langchain-xinference 已移除：全仓库 0 处 import（ChatXinference 只是死导入，
    # 向量化走 src/client.py 里自己实现的 CredentialedEmbeddings）。
    "nvidia-ml-py>=13.610.43",
    "passlib>=1.7.4",
    "pdf2image>=1.17.0",
    "pdfminer-six==20221105",
    "protobuf>=5.29.5",
    "pydantic-settings>=2.9.1",
    "pymilvus>=2.5.10",
    "pypdf>=5.6.0",
    "pypinyin>=0.55.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "redis>=6.2.0",
    "setuptools>=82.0.1",
    "sqlalchemy>=2.0.41",
    "tiktoken>=0.9.0",
    "transformers>=4.57.6",
    # extras 与 LOADER_MAPPING 的每一项一一对应，这是实测出来的：
    #   epub/odt -> pypandoc-binary（缺它时 .epub 直接 ImportError，实测）
    #   xlsx     -> openpyxl + msoffcrypto-tool（原先两包都不在 uv.lock 里，只在某台机器的
    #               venv 中被手工装过 —— `uv sync` 一跑，.xlsx 上传就回归解析失败，
    #               而且失败点离声明很远，看起来像代码坏了）
    # 故意**不写**的 extras：pdf（见下一行注释）、md（Markdown 走 TextLoader，
    #   走 unstructured 的 md 分支会在运行时联网下载 spaCy 句子模型）。
    "unstructured[csv,doc,docx,epub,odt,ppt,pptx,tsv,xlsx]>=0.17.2",
    # 下界写 1.0.2 是**故意压低**的：unstructured 0.22.x 的 PDF 分支要求 >=1.6.10，
    # 但满足它会把 torch 从 2.5.1 顶到 2.14 并拖进整套 CUDA 13（实测 dry-run），
    # 而 vllm 0.7.2 硬锁 torch==2.5.1 —— 为了 PDF 牺牲整个推理栈不值得。
    # 代价是 PDF 解析在此环境不可用，运行时会明确回 501 并说明缺什么（见 loader.ParserUnavailable）。
    "unstructured-inference>=1.0.2",
    # 后端只是 xinference 的**调用方**（只用 xinference.client），
    # 原先写的是 `xinference[all]==2.10` —— 那会把整个服务端 + vllm 0.7.2 装进应用环境，
    # 而 vllm 0.7.2 硬锁 `torch==2.5.1`，连带 transformers 卡在 4.57.x、读不懂新模型架构。
    # 服务端由 apps/inference 独立提供（见 scripts/setup_inference_env.sh 与 dev.sh）。
    "xinference-client>=3.5,<4",
]
